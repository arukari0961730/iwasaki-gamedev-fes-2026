<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランキング | ゲーム開発サークル 文化祭2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="/">1UP</a>
      <span class="blink">INSERT COIN</span>
      <span class="hi">HI-SCORE</span>
    </header>

    <main id="main"></main>
    <a class="back" href="/">◀ TOP</a>
  </div>

  <script type="module">
    import { findGame, escapeHtml, rankingItems, imageUrl } from "/js/games.js";
    import { watchRanking } from "/js/scores.js";

    const params = new URLSearchParams(location.search);
    const game = await findGame(params.get("game"));
    const main = document.getElementById("main");

    if (!game) {
      main.innerHTML = `<p class="notice">ゲームが見つかりませんでした。</p>`;
    } else {
      document.title = `${game.name} ランキング | ゲーム開発サークル 文化祭2026`;
      main.innerHTML = `
        <div class="game-head">
          <img class="shot" src="${imageUrl(game)}" alt="">
          <div>
            <h1 class="game-name">${escapeHtml(game.name)}</h1>
            <p class="desc">${escapeHtml(game.description)}</p>
            <a class="btn" href="/register?game=${game.id}">ENTRY ▶ スコアを登録</a>
          </div>
        </div>
        <p class="hs-title">HIGH SCORE</p>
        <ol class="ranking" id="ranking">${rankingItems(game, [], { min: 3 })}</ol>`;

      // 登録直後に飛んできたときは、その名前の行を点滅させる
      let justRegistered = null;
      try {
        const saved = JSON.parse(sessionStorage.getItem("justRegistered"));
        if (saved?.game === game.id) justRegistered = saved.name;
        sessionStorage.removeItem("justRegistered");
      } catch {}
      const list = document.getElementById("ranking");
      watchRanking(game.id, (records) => {
        list.innerHTML = rankingItems(game, records, { min: 3 });
        if (!justRegistered) return;
        const row = [...list.children].find((li) => li.dataset.name === justRegistered);
        if (row) {
          row.classList.add("is-new");
          row.scrollIntoView({ block: "center" });
          justRegistered = null;
        }
      });
    }
  </script>
</body>
</html>
