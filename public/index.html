<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲーム開発サークル 文化祭2026</title>
  <meta name="description" content="ゲーム開発サークルの文化祭展示。展示ゲームの紹介とハイスコアランキング。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-sticky">
  <div class="wrap">
    <header class="site-header">
      <a href="/">1UP</a>
      <span class="blink">INSERT COIN</span>
      <span class="hi">HI-SCORE</span>
    </header>

    <h1 class="site-title">GAMEDEV CIRCLE<br>FES 2026</h1>

    <!-- ランキング登録の入り口。遊んだゲームを選ぶ画面に進む -->
    <a class="entry-cta" href="/register" data-entry>
      <span class="arrow-blink">▶</span> SCORE ENTRY
      <small>遊んだゲームのスコアを登録する</small>
    </a>
    <!-- 受付終了後に出す。ENTRY_OPEN（js/config.js）で切り替える -->
    <p class="entry-cta closed" hidden id="entry-closed">
      GAME OVER
      <small>スコア登録の受付は終了しました。ランキングは文化祭当日の最終結果です</small>
    </p>

    <section class="carousel" id="carousel" aria-label="ランキングのあるゲーム"></section>

    <h2 class="section-title">GAME LIST</h2>
    <section class="game-list" id="game-list"></section>
  </div>

  <!-- スマホでは画面の下にずっと表示しておく -->
  <a class="sticky-entry" href="/register" data-entry>▶ SCORE ENTRY　スコア登録</a>

  <script type="module">
    import { loadGames, rankingGames, escapeHtml, imageUrl } from "/js/games.js";
    import { mountCarousel } from "/js/carousel.js";
    import { ENTRY_OPEN } from "/js/config.js";

    if (!ENTRY_OPEN) {
      document.querySelectorAll("[data-entry]").forEach((el) => el.remove());
      document.body.classList.remove("has-sticky");
      document.getElementById("entry-closed").hidden = false;
    }

    const games = await loadGames();

    mountCarousel(document.getElementById("carousel"), rankingGames(games));

    // ゲーム一覧：ランキングのあるゲームには「スコア登録」と「ランキング」のボタンを付ける
    document.getElementById("game-list").innerHTML = games.map((g) => `
      <div class="card">
        <img class="shot" src="${imageUrl(g)}" alt="${escapeHtml(g.name)} のゲーム画面" loading="lazy">
        <h3>${escapeHtml(g.name)}</h3>
        <p>${escapeHtml(g.description)}</p>
        ${g.ranking.enabled ? `
        <div class="actions">
          ${ENTRY_OPEN ? `<a class="btn jp" href="/register?game=${g.id}">スコア登録 ▶</a>` : ""}
          <a class="btn jp sub" href="/ranking?game=${g.id}">ランキング</a>
        </div>` : ""}
      </div>`).join("");
  </script>
</body>
</html>
